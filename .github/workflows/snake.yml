name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # Runs every day at midnight UTC
  workflow_dispatch:        # Manual trigger from Actions tab
  push:
    branches:
      - main

# ✅ FIX: Grant write permission so the action can push to the output branch
permissions:
  contents: write

jobs:
  generate:
    name: Generate GitHub Contribution Snake
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Snake SVG (light + dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: tripurari2004
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: true   # ✅ Prevents force-push conflicts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
